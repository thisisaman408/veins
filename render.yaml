services:
  # ── Backend (Node.js + Socket.io) ──────────────────────────────────────────
  - type: web
    name: veritas-server
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: node src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: MONGO_URI
        sync: false          # set this in Render dashboard → Environment
      - key: ADMIN_KEY
        sync: false          # set this in Render dashboard → Environment
      - key: CLIENT_URL
        sync: false          # set to your Vercel URL after deploying frontend

  # ── Frontend (Vite/React) ───────────────────────────────────────────────────
  - type: web
    name: veritas-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_SERVER_URL
        sync: false          # set to your Render backend URL above
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
